<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Detail | OS DELIVERY</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .product-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }

    .product-img {
      width: 100%;
      border-radius: 6px;
      border: 1px solid #ddd;
    }

    .price-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0;
    }

    .price-now {
      font-size: 26px;
      font-weight: bold;
      color: #e65c00;
    }

    .price-old {
      font-size: 16px;
      color: #999;
      text-decoration: line-through;
    }

    .discount-tag {
      background: #fdecea;
      color: #dc3545;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
    }

    .addon-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .addon-item:hover {
      background: #f9f9f9;
    }

    .addon-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .addon-price {
      margin-left: auto;
      font-weight: bold;
      color: #e65c00;
    }

    .qty-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 15px 0;
    }

    .qty-box button {
      width: 36px;
      height: 36px;
      border: 1px solid #ccc;
      background: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }

    .qty-box button:hover {
      background: #f0f0f0;
    }

    .qty-box span {
      font-size: 18px;
      font-weight: bold;
      min-width: 30px;
      text-align: center;
    }

    .total-line {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .total-line strong {
      color: #e65c00;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .meta-row {
      display: flex;
      gap: 20px;
      font-size: 13px;
      color: #777;
      margin-bottom: 10px;
    }

    @media (max-width: 768px) {
      .product-layout { grid-template-columns: 1fr; }
      .btn-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">OS DELIVERY</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="discounts.html">Deals</a></li>
      <li><a href="cart.html">Cart</a></li>
    </ul>
    <a href="cart.html" class="cart-btn">
      🛒 Cart <span class="cart-count">0</span>
    </a>
  </nav>

  <div class="container" style="margin-top: 20px;">

    <p style="font-size: 13px; color: #777; margin-bottom: 15px;">
      <a href="discounts.html">Deals</a> &rsaquo; Product Detail
    </p>

    <div class="product-layout">

      <!-- Left: Image -->
      <div>
        <img id="pd-img" src="" alt="Product" class="product-img">
        <p id="pd-category" style="font-size: 12px; color: #999; margin-top: 8px; text-transform: uppercase;"></p>
      </div>

      <!-- Right: Info & Controls -->
      <div>
        <span id="pd-badge" class="badge badge-orange" style="margin-bottom: 10px; display: inline-block;"></span>
        <h1 id="pd-name" style="font-size: 22px; margin-bottom: 6px; color: #1a1a2e;"></h1>

        <div class="meta-row">
          <span><span id="pd-rating"></span></span>
          <span>⏱<span id="pd-preptime"></span></span>
        </div>

        <p id="pd-desc" style="color: #555; font-size: 14px; line-height: 1.6; margin-bottom: 15px;"></p>

        <div class="price-row">
          <span class="price-now" id="pd-price"></span>
          <span class="price-old" id="pd-orig-price"></span>
          <span class="discount-tag" id="pd-discount"></span>
        </div>

        <!-- Add-ons -->
        <div style="margin-bottom: 15px;">
          <label style="font-size: 15px; margin-bottom: 8px;">Optional Add-ons:</label>
          <div id="pd-addons"></div>
        </div>

        <!-- Quantity -->
        <div class="qty-box">
          <label style="margin: 0;">Quantity:</label>
          <button onclick="changeQty(-1)">−</button>
          <span id="qty-display">1</span>
          <button onclick="changeQty(1)">+</button>
        </div>

        <!-- Running Total -->
        <div class="total-line">
          Total: <strong id="pd-total">TK0</strong>
        </div>

        <!-- Special Note -->
        <div class="form-group">
          <label for="pd-note">Special Note for Kitchen:</label>
          <input type="text" id="pd-note" placeholder=" ">
        </div>

        <!-- Action Buttons -->
        <div class="btn-row">
          <button class="btn btn-primary" onclick="doAddToCart()"> Add to Cart</button>
          <button class="btn btn-secondary" onclick="doBuyNow()"> Buy Now</button>
        </div>

      </div>
    </div>

    <!-- Related Items -->
    <h2 style="font-size: 18px; margin-bottom: 15px;">You May Also Like</h2>
    <div class="grid-3" id="related-grid"></div>

  </div>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id") || "prod-101";
    const product = getProductById(productId);
    let currentQty = 1;

    // Fill in product info
    document.getElementById("pd-img").src = product.image;
    document.getElementById("pd-img").alt = product.name;
    document.getElementById("pd-name").textContent = product.name;
    document.getElementById("pd-desc").textContent = product.description;
    document.getElementById("pd-rating").textContent = product.rating + " / 5";
    document.getElementById("pd-preptime").textContent = product.prepTime;
    document.getElementById("pd-category").textContent = product.category;
    document.getElementById("pd-badge").textContent = product.discountPercent + "% OFF";
    document.getElementById("pd-price").textContent = "TK" + product.price;
    document.getElementById("pd-orig-price").textContent = "TK" + product.originalPrice;
    document.getElementById("pd-discount").textContent = "-" + product.discountPercent + "%";

    // Add-ons
    const addonsEl = document.getElementById("pd-addons");
    if (product.addOns && product.addOns.length > 0) {
      product.addOns.forEach(addon => {
        const div = document.createElement("div");
        div.className = "addon-item";
        div.innerHTML = `
          <input type="checkbox" id="${addon.id}" data-id="${addon.id}" data-name="${addon.name}" data-price="${addon.price}">
          <label for="${addon.id}" style="cursor:pointer; margin:0; font-weight:normal;">${addon.name}</label>
          <span class="addon-price">+TK${addon.price}</span>
        `;
        div.addEventListener("change", updateTotal);
        addonsEl.appendChild(div);
      });
    } else {
      addonsEl.textContent = "No add-ons for this item.";
    }

    updateTotal();

    function getSelectedAddons() {
      const checked = document.querySelectorAll("#pd-addons input:checked");
      return Array.from(checked).map(cb => ({
        id: cb.dataset.id,
        name: cb.dataset.name,
        price: parseInt(cb.dataset.price)
      }));
    }

    function updateTotal() {
      const addonCost = getSelectedAddons().reduce((s, a) => s + a.price, 0);
      const total = (product.price + addonCost) * currentQty;
      document.getElementById("pd-total").textContent = "TK" + total;
    }

    function changeQty(delta) {
      currentQty = Math.max(1, Math.min(20, currentQty + delta));
      document.getElementById("qty-display").textContent = currentQty;
      updateTotal();
    }

    function doAddToCart() {
      const note = document.getElementById("pd-note").value;
      addToCart(product, currentQty, getSelectedAddons(), note);
    }

    function doBuyNow() {
      const note = document.getElementById("pd-note").value;
      addToCart(product, currentQty, getSelectedAddons(), note);
      window.location.href = "checkout.html";
    }

    // Related items
    const related = LND_CATALOG.filter(p => p.id !== productId).slice(0, 3);
    const relGrid = document.getElementById("related-grid");
    related.forEach(p => {
      const div = document.createElement("div");
      div.className = "card";
      div.style.padding = "0";
      div.innerHTML = `
        <img src="${p.image}" alt="${p.name}" style="width:100%; height:160px; object-fit:cover; border-radius:6px 6px 0 0;">
        <div style="padding: 12px;">
          <h4 style="font-size: 14px; margin-bottom: 6px;">${p.name}</h4>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong style="color:#e65c00;">TK${p.price}</strong>
            <a href="product-detail.html?id=${p.id}" class="btn btn-sm btn-outline">View</a>
          </div>
        </div>
      `;
      relGrid.appendChild(div);
    });
  </script>
</body>
</html>
