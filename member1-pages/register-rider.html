
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieGo - Rider Registration</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <header>
        <h1>🍔 FoodieGo</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <section class="registration-section">

        <div class="registration-container">

            <h2>Rider Registration</h2>

            <p>Enter your information to register as a FoodieGo rider.</p>

            <form id="riderForm">

                <label>Full Name:</label>
                <input type="text" id="riderName" placeholder="Enter your full name">

                <label>Email:</label>
                <input type="email" id="riderEmail" placeholder="Enter your email address">

                <label>Password:</label>
                <input type="password" id="riderPassword" placeholder="Create a password">

                <label>NID Number:</label>
                <input type="text" id="riderNID" placeholder="Enter your NID number">

                <label>Vehicle Type:</label>

                <select id="vehicleType">
                    <option value="">Select Vehicle</option>
                    <option value="Bicycle">Bicycle</option>
                    <option value="Motorcycle">Motorcycle</option>
                    <option value="Car">Car</option>
                </select>

                <label>Driving License Number:</label>
                <input type="text" id="licenseNumber" placeholder="Enter your license number">

                <p id="riderMessage"></p>

                <button type="submit">Register as Rider</button>

            </form>

        </div>

    </section>

    <footer>
        <p>© 2026 FoodieGo. All Rights Reserved.</p>
    </footer>

</body>
</html>
