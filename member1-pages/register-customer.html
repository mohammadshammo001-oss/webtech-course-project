
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oriental Street - Customer Registration</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <header>
        <h1>🍔 Oriental Street</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <section class="registration-section">

        <div class="registration-container">

            <h2>Customer Registration</h2>

            <p>Create your Oriental Street account.</p>

            <form id="customerForm" novalidate>

                <label>Full Name:</label>
                <input type="text" id="customerName"
                    placeholder="Enter your full name">

                <label>Email:</label>
                <input type="email" id="customerEmail"
                    placeholder="Enter your email address">

                <label>Phone Number:</label>
                <input type="tel" id="customerPhone"
                    placeholder="Enter your 11-digit phone number">

                <label>Password:</label>
                <input type="password" id="customerPassword"
                    placeholder="Enter your password">

                <p id="customerMessage"></p>

                <button type="submit">Register</button>

            </form>

            <p>
                Already registered?
                <a href="register-customer-profile.html">
                    Continue to Delivery Profile
                </a>
            </p>

            <p>
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </div>

    </section>

    <footer>
        <p>© 2026 Oriental Street. All Rights Reserved.</p>
    </footer>

</body>
</html>
