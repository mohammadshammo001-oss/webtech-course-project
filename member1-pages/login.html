
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FoodieGo - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <h1>🍔 FoodieGo</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register-customer.html">Sign Up</a>
        </nav>
    </header>

    <!-- Login Section -->
    <section class="login-section">

        <div class="login-container">

            <h2>Welcome Back!</h2>
            <p>Login to your FoodieGo account.</p>

            <h3 id="selectedRole">Login as Customer</h3>

            <!-- Role Selection -->
            <div class="role-selection">
                <button type="button" onclick="selectRole('Customer')">Customer</button>

                <button type="button" onclick="selectRole('Rider')">Rider</button>

                <button type="button" onclick="selectRole('Admin')">Admin</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm">

                <label>Email Address:</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label>Password:</label>
                <input type="password" id="password" placeholder="Enter your password" required>

                <p id="errorMessage"></p>

                <button type="submit">Login</button>

            </form>

            <p class="register-link">
                Don't have an account?
                <a href="register-customer.html">Sign Up</a>
            </p>

        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 FoodieGo. All Rights Reserved.</p>
    </footer>

</body>
</html>
