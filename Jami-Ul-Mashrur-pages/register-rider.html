
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oriental Street - Rider Registration</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <header>
        <h1>🍔 Oriental Street</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <section class="registration-section">

        <div class="registration-container">

            <h2>Rider Registration</h2>

            <p>Enter your information to register as an Oriental Street rider.</p>

            <form id="riderForm">

                <label for="riderName">Full Name:</label>
                <input type="text" id="riderName" placeholder="Enter your full name" required>

                <label for="riderEmail">Email:</label>
                <input type="email" id="riderEmail" placeholder="Enter your email address" required>

                <label for="riderPassword">Password:</label>
                <input type="password" id="riderPassword" placeholder="Create a password" required>

                <label for="riderNID">NID Number:</label>
                <input type="text" id="riderNID" placeholder="Enter your NID number" required>

                <label for="vehicleType">Vehicle Type:</label>

                <select id="vehicleType" required>
                    <option value="">Select Vehicle</option>
                    <option value="Bicycle">Bicycle</option>
                    <option value="Motorcycle">Motorcycle</option>
                    <option value="Car">Car</option>
                </select>

                <label for="licenseNumber">Driving License Number:</label>
                <input type="text" id="licenseNumber" placeholder="Enter your license number" required>

                <p id="riderMessage"></p>

                <button type="submit">Register as Rider</button>

            </form>

        </div>

    </section>

    <footer>
        <p>© 2026 Oriental Street. All Rights Reserved.</p>
    </footer>

</body>
</html>
